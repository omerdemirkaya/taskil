name: Build Taskil

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64, arch: x64 }
          - { os: macos-latest,   label: macos-arm64, arch: arm64 }
          - { os: macos-15-intel, label: macos-intel, arch: intel }
          - { os: ubuntu-22.04,   label: linux-x64,   arch: x64 }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Linux icin Tk kutuphaneleri
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk-dev

      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Derle
        run: python build.py --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: Taskil-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Dosyalari surume ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: out/*
